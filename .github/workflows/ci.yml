name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run versions:check
      - run: bun run check
      - run: bun run build
      - run: bun run pack:check
      - run: bun test

  # Fails a pull request that changes a package without shipping a changeset, so the
  # fixed group cannot drift. A docs/examples-only pull request changes no package and
  # passes. Remove this job if you would rather review releases without the gate.
  changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: changeset present
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          bunx changeset status --since="origin/${{ github.base_ref }}"
